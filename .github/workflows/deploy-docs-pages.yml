name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "NativeChemistryLab/Assets/ChemistryLab/Resources/Chemistry/compound-generation-matrix.json"
      - ".github/workflows/deploy-docs-pages.yml"
      - "README.md"
      - "NativeChemistryLab/README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static docs artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/NativeChemistryLab/Assets/ChemistryLab/Resources/Chemistry
          cp -R docs _site/docs
          cp NativeChemistryLab/Assets/ChemistryLab/Resources/Chemistry/compound-generation-matrix.json \
            _site/NativeChemistryLab/Assets/ChemistryLab/Resources/Chemistry/compound-generation-matrix.json
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=docs/chemistry/compound-matrix-3d.html">
            <title>Chemistry Lab Docs</title>
          </head>
          <body>
            <a href="docs/chemistry/compound-matrix-3d.html">Open Chemistry Lab 3D matrix</a>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
